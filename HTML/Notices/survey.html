<div id="noticeModal" class="notice-overlay">
    <main class="maintenance-wrapper">
        <div class="aero-card">
            
            <!-- Reflejo superior estilo Aero Glass -->
            <div class="glass-reflection"></div>

            <!-- Logo -->
            <img src="Assets/Images/FlashYngStudios/FlashYngStudios_Logo.png" alt="FlashYng Studios" class="brand-logo-aero pixel-art">

            <!-- Estado / Badge -->
            <div class="status-badge">
                <span class="status-dot"></span>
                <span>Buscando Playtesters</span>
            </div>

            <!-- Contenido del aviso -->
            <h1 class="aero-title">¡Queremos tu opinión!</h1>
            <p class="aero-description">
                Estamos testeando nuevas mecánicas para nuestro próximo proyecto y nos encantaría conocer tu experiencia.
            </p>

            <p class="aero-description">
                {TEXTO_FECHA}
            </p>

            <!-- Acciones -->
            <div class="aero-actions">
                <a href="{URL_DESTINO}" target="_blank" rel="noopener" class="aero-btn primary">
                    <span>Ir a la encuesta</span>
                    <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M5 12h14M12 5l7 7-7 7"/>
                    </svg>
                </a>
                
                <button type="button" onclick="cerrarAviso()" class="aero-btn secondary" style="margin-top: 8px;">
                    <span>Omitir por ahora</span>
                </button>
            </div>

        </div>
    </main>
</div>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> 404 | FlashYng Studios</title>
    
    <link rel="stylesheet" href="CSS/base.css">
    <link rel="stylesheet" href="CSS/404.css">
</head>

<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-ELCMVDMWVH"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());

  gtag('config', 'G-ELCMVDMWVH');
</script>

<body>

    <!-- Fondo Aero -->
    <div class="aero-bg">
        <div class="aero-orb orb-1"></div>
        <div class="aero-orb orb-2"></div>
    </div>

    <!-- Contenedor Principal -->
    <main class="error-wrapper">
        <div class="aero-card">
            
            <div class="glass-reflection"></div>

            <!-- Logo de la Marca (Igual que en Index) -->
            <header class="brand-header">
                <img src="Assets/Images/FlashYngStudios/FlashYngStudios_Logo.png" alt="FlashYng Studios Logo" class="brand-logo">
            </header>

            <!-- Badge indicador 404 -->
            <div class="status-badge error-badge">
                <span class="status-dot"></span>
                <span>ERROR 404</span>
            </div>

            <!-- Mensaje principal -->
            <h1 class="aero-title">¡Oops! La página no existe</h1>
            
            <p class="aero-description">
                Es posible que el enlace esté roto o que la página haya sido trasladada o eliminada.
            </p>

            <!-- Único Botón Azul Aero -->
            <div class="aero-actions">
                <a href="home.html" class="aero-btn primary">
                    <span>Volver al inicio</span>
                    <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M5 12h14M12 5l7 7-7 7"/>
                    </svg>
                </a>
            </div>

        </div>
    </main>

</body>
</html>
